name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

jobs:
  static-qa:
    name: Static release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Run static release gate
        env:
          FOXBEAR_RELEASE_PHASE: static
        run: npm run check:release

  browser-qa:
    name: Browser release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser release gate
        env:
          FOXBEAR_RELEASE_PHASE: browser
        run: npm run check:release

      - name: Upload browser QA diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/browser-results
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  build:
    name: Prepare Pages artifact
    needs: [static-qa, browser-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        shell: bash
        run: bash tools/prepare-pages-site.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages_url.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment_primary
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          timeout: 600000
          error_count: 10
          reporting_interval: 5000

      - name: Retry GitHub Pages deployment once
        id: deployment_retry
        if: steps.deployment_primary.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          timeout: 600000
          error_count: 10
          reporting_interval: 5000

      - name: Expose deployed Pages URL
        id: pages_url
        if: always()
        shell: bash
        run: |
          primary_url='${{ steps.deployment_primary.outputs.page_url }}'
          retry_url='${{ steps.deployment_retry.outputs.page_url }}'
          page_url="${primary_url:-${retry_url}}"
          echo "page_url=${page_url}" >> "$GITHUB_OUTPUT"
