name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

jobs:
  static-qa:
    name: Static release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Sanitize allowlisted repository-local artifacts before install
        env:
          FOXBEAR_SOURCE_HYGIENE_MODE: ci-safe
        run: npm run source:hygiene:gate

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Run static release gate
        env:
          FOXBEAR_RELEASE_PHASE: static
          FOXBEAR_SOURCE_HYGIENE_MODE: ci-safe
        run: npm run check:release

  browser-qa:
    name: Browser release gate
    needs: static-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Select browser QA impact scope
        id: browser_scope
        run: node qa/browser/select-browser-scope.js

      - name: Run browser fixture preflight
        if: steps.browser_scope.outputs.run_browser == 'true'
        run: npm run qa:browser:preflight

      - name: Install pinned dependencies
        if: steps.browser_scope.outputs.run_browser == 'true'
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Restore Playwright browser cache
        id: playwright-cache
        if: steps.browser_scope.outputs.run_browser == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Prepare browser flaky history cache
        if: steps.browser_scope.outputs.run_browser == 'true'
        run: mkdir -p qa/browser-history

      - name: Restore browser flaky history
        id: browser-flaky-cache
        if: steps.browser_scope.outputs.run_browser == 'true'
        uses: actions/cache/restore@v5
        with:
          path: qa/browser-history
          key: browser-flaky-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            browser-flaky-${{ runner.os }}-${{ github.ref_name }}-

      - name: Install Chromium and system dependencies
        if: steps.browser_scope.outputs.run_browser == 'true'
        run: npx --no-install playwright install --with-deps chromium

      - name: Run primary browser release gate
        id: browser_primary
        if: steps.browser_scope.outputs.run_browser == 'true'
        continue-on-error: true
        env:
          FOXBEAR_RELEASE_PHASE: browser
          FOXBEAR_BROWSER_SPECS: ${{ steps.browser_scope.outputs.specs }}
        run: npm run check:release

      - name: Retry only failed browser cases once
        id: browser_retry
        if: steps.browser_scope.outputs.run_browser == 'true' && steps.browser_primary.outcome == 'failure'
        run: npm run qa:browser:retry

      - name: Summarize browser retry recovery
        if: always() && steps.browser_scope.outputs.run_browser == 'true' && steps.browser_primary.outcome == 'failure'
        run: npm run qa:browser:retry:report

      - name: Verify failed browser cases truly passed
        if: always() && steps.browser_scope.outputs.run_browser == 'true' && steps.browser_primary.outcome == 'failure'
        run: npm run qa:browser:retry:verify

      - name: Save updated browser flaky history
        if: always() && steps.browser_scope.outputs.run_browser == 'true' && steps.browser_primary.outcome == 'failure'
        uses: actions/cache/save@v5
        with:
          path: qa/browser-history
          key: browser-flaky-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload browser QA diagnostics after a primary failure
        if: always() && steps.browser_scope.outputs.run_browser == 'true' && steps.browser_primary.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/browser-results
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  build:
    name: Prepare Pages artifact
    needs: [static-qa, browser-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        shell: bash
        run: bash tools/prepare-pages-site.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages_url.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment_primary
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          timeout: 600000
          error_count: 10
          reporting_interval: 5000

      - name: Retry GitHub Pages deployment once
        id: deployment_retry
        if: steps.deployment_primary.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          timeout: 600000
          error_count: 10
          reporting_interval: 5000

      - name: Expose deployed Pages URL
        id: pages_url
        if: always()
        shell: bash
        run: |
          primary_url='${{ steps.deployment_primary.outputs.page_url }}'
          retry_url='${{ steps.deployment_retry.outputs.page_url }}'
          page_url="${primary_url:-${retry_url}}"
          echo "page_url=${page_url}" >> "$GITHUB_OUTPUT"
