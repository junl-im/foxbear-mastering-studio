name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Install Chromium for browser QA
        run: npx --no-install playwright install --with-deps chromium

      - name: Run release gate
        run: npm run check:release

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload browser QA diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/browser-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare static artifact
        shell: bash
        run: bash tools/prepare-pages-site.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages_url.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment_primary
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          timeout: 600000
          error_count: 10
          reporting_interval: 5000

      - name: Retry GitHub Pages deployment once
        id: deployment_retry
        if: steps.deployment_primary.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          timeout: 600000
          error_count: 10
          reporting_interval: 5000

      - name: Expose deployed Pages URL
        id: pages_url
        if: always()
        shell: bash
        run: |
          primary_url='${{ steps.deployment_primary.outputs.page_url }}'
          retry_url='${{ steps.deployment_retry.outputs.page_url }}'
          page_url="${primary_url:-${retry_url}}"
          echo "page_url=${page_url}" >> "$GITHUB_OUTPUT"
